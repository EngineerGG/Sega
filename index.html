<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sega Mega Drive Collection</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ========== МЕНЮ ========== */
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        h1 {
            color: #00ffcc;
            text-shadow: 2px 2px #ff00cc;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .game-btn {
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border: 2px solid #00ffcc;
            color: #fff;
            padding: 15px 20px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .game-btn:active {
            background: #00ffcc;
            color: #000;
            transform: scale(0.98);
        }
        
        .game-btn span {
            float: right;
            opacity: 0.7;
            font-size: 14px;
        }

        /* ========== ЭКРАН ИГРЫ ========== */
        #game-container {
            display: none;
            width: 100%;
            max-width: 640px;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            height: 100vh;
        }
        
        /* Контейнер для canvas эмулятора - занимает верхнюю часть */
        #game {
            width: 100%;
            max-height: 55vh; /* Игра занимает 55% высоты экрана */
            aspect-ratio: 4 / 3;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        #back-btn {
            padding: 8px 16px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        /* ========== КАСТОМНЫЙ ГЕЙМПАД ========== */
        #custom-gamepad {
            width: 100%;
            max-width: 640px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            flex-grow: 1;
        }
        
        /* D-Pad (стрелки) */
        .dpad {
            position: relative;
            width: 140px;
            height: 140px;
        }
        
        .dpad-btn {
            position: absolute;
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .dpad-btn:active, .dpad-btn.pressed {
            background: #00ffcc;
            color: #000;
            transform: scale(0.95);
        }
        
        .dpad-up {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            border-radius: 8px 8px 0 0;
        }
        
        .dpad-down {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            border-radius: 0 0 8px 8px;
        }
        
        .dpad-left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border-radius: 8px 0 0 8px;
        }
        
        .dpad-right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border-radius: 0 8px 8px 0;
        }
        
        .dpad-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: #1e1e1e;
            border: 2px solid #00ffcc;
        }
        
        /* Кнопки действий A, B, C, Start */
        .action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .action-row {
            display: flex;
            gap: 15px;
        }
        
        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            border: 2px solid #ff00cc;
            color: #ff00cc;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .action-btn:active, .action-btn.pressed {
            background: #ff00cc;
            color: #000;
            transform: scale(0.9);
        }
        
        .start-btn {
            width: 80px;
            height: 35px;
            border-radius: 18px;
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            border: 2px solid #ffff00;
            color: #ffff00;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            margin-top: 10px;
        }
        
        .start-btn:active, .start-btn.pressed {
            background: #ffff00;
            color: #000;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Меню выбора игр -->
    <div id="menu">
        <h1>🎮 SEGA MEGA DRIVE</h1>
        <button class="game-btn" onclick="startGame('roadrash3.gen')">Road Rash 3 <span>▶</span></button>
        <button class="game-btn" onclick="startGame('dune.gen')">Dune: Battle for Arrakis <span>▶</span></button>
        <button class="game-btn" onclick="startGame('gley_lancer.gen')">Gley Lancer <span>▶</span></button>
        <button class="game-btn" onclick="startGame('battletech.gen')">BattleTech: Armored Combat <span>▶</span></button>
        <button class="game-btn" onclick="startGame('comix_zone.gen')">Comix Zone <span>▶</span></button>
        <button class="game-btn" onclick="startGame('nba_jam.gen')">NBA Jam: Tournament Ed. <span>▶</span></button>
    </div>

    <!-- Контейнер для игры -->
    <div id="game-container">
        <button id="back-btn" onclick="goBack()">⬅ Меню</button>
        
        <!-- Эмулятор -->
        <div id="game"></div>
        
        <!-- Кастомный геймпад ПОД игрой -->
        <div id="custom-gamepad">
            <!-- D-Pad слева -->
            <div class="dpad">
                <div class="dpad-btn dpad-up" data-key="ArrowUp">▲</div>
                <div class="dpad-btn dpad-down" data-key="ArrowDown">▼</div>
                <div class="dpad-btn dpad-left" data-key="ArrowLeft">◀</div>
                <div class="dpad-btn dpad-right" data-key="ArrowRight">▶</div>
                <div class="dpad-center"></div>
            </div>
            
            <!-- Кнопки действий справа -->
            <div class="action-buttons">
                <div class="action-row">
                    <div class="action-btn" data-key="a">A</div>
                    <div class="action-btn" data-key="b">B</div>
                    <div class="action-btn" data-key="c">C</div>
                </div>
                <div class="start-btn" data-key="Enter">START</div>
            </div>
        </div>
    </div>

    <script>
        // Проверяем параметр в URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameToLoad = urlParams.get('game');

        if (gameToLoad) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            // Настройки эмулятора
            window.EJS_player = '#game';
            window.EJS_gameUrl = gameToLoad;
            window.EJS_core = 'segaMD';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;
            window.EJS_color = '#00ffcc';
            window.EJS_lang = 'ru';
            
            // ОТКЛЮЧАЕМ стандартный геймпад EmulatorJS
            window.EJS_gamepad = false;
            
            // ========== НАСТРОЙКА КАСТОМНОГО ГЕЙМПАДА ==========
            
            // Функция отправки нажатия клавиши в эмулятор
            function sendKeyPress(key, pressed) {
                const event = new KeyboardEvent(pressed ? 'keydown' : 'keyup', {
                    key: key,
                    code: key,
                    keyCode: key.charCodeAt(0),
                    which: key.charCodeAt(0),
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);
            }
            
            // Привязываем события ко всем кнопкам геймпада
            const buttons = document.querySelectorAll('[data-key]');
            
            buttons.forEach(btn => {
                const key = btn.getAttribute('data-key');
                
                // Touch события (для мобильных)
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.classList.add('pressed');
                    sendKeyPress(key, true);
                    if (navigator.vibrate) navigator.vibrate(20);
                });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('pressed');
                    sendKeyPress(key, false);
                });
                
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.classList.remove('pressed');
                    sendKeyPress(key, false);
                });
                
                // Mouse события (для десктопа)
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    btn.classList.add('pressed');
                    sendKeyPress(key, true);
                });
                
                btn.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    btn.classList.remove('pressed');
                    sendKeyPress(key, false);
                });
                
                btn.addEventListener('mouseleave', (e) => {
                    btn.classList.remove('pressed');
                    sendKeyPress(key, false);
                });
            });
            
            // Предотвращаем стандартное поведение touch-событий на всей странице
            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#custom-gamepad')) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        // Функция запуска игры
        function startGame(romFile) {
            window.location.href = window.location.pathname + '?game=' + romFile;
        }

        // Функция возврата в меню
        function goBack() {
            window.location.href = window.location.pathname;
        }
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
